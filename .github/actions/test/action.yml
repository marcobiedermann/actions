name: Testing
description: Installs dependencies via npm ci and runs the lint, build, and coverage scripts (each skipped if not defined).

runs:
  using: "composite"
  steps:
    - name: Install Node modules
      shell: bash
      run: npm ci

    - name: Linting
      shell: bash
      run: npm run lint --if-present

    - name: Building
      shell: bash
      run: npm run build --if-present

    - name: Testing
      shell: bash
      run: npm run coverage --if-present
